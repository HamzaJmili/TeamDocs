<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">TeamDocs: from documents to answers with evidence</title><desc id="desc">Preparation: public documents are split into source-linked passages and optionally embedded. At question time, the service retrieves passages and returns exact excerpts in demo mode or AI claims in live mode. The reader can open the original sources. One FastAPI service runs on Render; credentials stay on the server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8fa377"/></marker></defs>
<rect width="1280" height="820" rx="22" fill="#f6f8f0"/>
<rect x="0" y="0" width="1280" height="156" rx="22" fill="#263c30"/><rect x="0" y="130" width="1280" height="26" fill="#263c30"/>
<text x="48" y="46" fill="#caddb5" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">TEAMDOCS / THE BIG PICTURE</text>
<text x="48" y="101" fill="#f8fbf2" font-family="Georgia,serif" font-size="38">Find the answer. Keep the evidence.</text>
<text x="48" y="132" fill="#b8c7af" font-family="Arial,sans-serif" font-size="14">A small document library, a transparent search process, and sources you can inspect.</text>
<text x="48" y="204" fill="#728761" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">01 / PREPARE THE SHELF — WHEN DOCUMENTS CHANGE</text>
<g font-family="Arial,sans-serif">
<rect x="48" y="230" width="335" height="142" rx="12" fill="#fffef9" stroke="#d9e1ce"/>
<text x="72" y="262" fill="#8a9f71" font-size="12">PUBLIC DOCUMENTS</text><text x="72" y="296" fill="#2d4232" font-size="23">The knowledge</text><text x="72" y="325" fill="#75816b" font-size="14">20 fictional company guides.</text><text x="72" y="349" fill="#75816b" font-size="14">Markdown and text-based PDFs.</text>
<path d="M391 300h45" stroke="#8fa377" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="447" y="230" width="335" height="142" rx="12" fill="#fffef9" stroke="#d9e1ce"/>
<text x="471" y="262" fill="#8a9f71" font-size="12">EXTRACT + SPLIT</text><text x="471" y="296" fill="#2d4232" font-size="23">Passages with an address</text><text x="471" y="325" fill="#75816b" font-size="14">Keep the title, section and PDF page.</text><text x="471" y="349" fill="#75816b" font-size="14">Stable IDs point back to each source.</text>
<path d="M790 300h45" stroke="#8fa377" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846" y="230" width="386" height="142" rx="12" fill="#e9f0de" stroke="#c9d8b7"/>
<text x="870" y="262" fill="#7a9160" font-size="12">SAVE THE SEARCH INDEX</text><text x="870" y="296" fill="#2d4232" font-size="23">Ready to find</text><text x="870" y="325" fill="#75816b" font-size="14">JSON passages for keyword search.</text><text x="870" y="349" fill="#75816b" font-size="14">Optional embeddings for meaning search.</text>
<text x="48" y="433" fill="#728761" font-size="12" letter-spacing="2">02 / FOLLOW THE EVIDENCE — FOR EACH QUESTION</text>
<rect x="48" y="461" width="250" height="172" rx="12" fill="#fffef9" stroke="#d9e1ce"/>
<text x="70" y="495" fill="#8a9f71" font-size="12">ASK</text><text x="70" y="529" fill="#2d4232" font-size="22">“How do I get</text><text x="70" y="557" fill="#2d4232" font-size="22">staging access?”</text><text x="70" y="599" fill="#75816b" font-size="13">Optional collection filter.</text>
<path d="M305 544h34" stroke="#8fa377" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="351" y="461" width="250" height="172" rx="12" fill="#e9f0de" stroke="#c9d8b7"/>
<text x="373" y="495" fill="#7a9160" font-size="12">RETRIEVE</text><text x="373" y="529" fill="#2d4232" font-size="22">Find 5 useful</text><text x="373" y="557" fill="#2d4232" font-size="22">passages</text><text x="373" y="585" fill="#75816b" font-size="13">Keyword, semantic or hybrid.</text><text x="373" y="607" fill="#75816b" font-size="13">A ranking, not confidence.</text>
<path d="M610 544h34" stroke="#8fa377" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="461" width="267" height="172" rx="12" fill="#fffef9" stroke="#d9e1ce"/>
<text x="677" y="495" fill="#8a9f71" font-size="12">RESPOND</text><text x="677" y="529" fill="#2d4232" font-size="22">Evidence first</text><text x="677" y="560" fill="#75816b" font-size="13">Demo: quote exact sentences.</text><text x="677" y="584" fill="#75816b" font-size="13">Live: AI writes cited claims.</text><text x="677" y="608" fill="#75816b" font-size="13">Check that citation IDs exist.</text>
<path d="M931 544h34" stroke="#8fa377" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="977" y="461" width="255" height="172" rx="12" fill="#263c30"/>
<text x="999" y="495" fill="#b6ce9c" font-size="12">VERIFY</text><text x="999" y="529" fill="#f8fbf2" font-size="22">Open the source</text><text x="999" y="560" fill="#b8c7af" font-size="13">Read the supporting passage.</text><text x="999" y="584" fill="#b8c7af" font-size="13">Download the original.</text><text x="999" y="608" fill="#b8c7af" font-size="13">Judge the answer yourself.</text>
<path d="M1039 379v31H476v43" stroke="#8fa377" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="684" width="1184" height="89" rx="10" fill="#ecefe4"/>
<text x="72" y="716" fill="#3f5839" font-size="15" font-weight="bold">ONE SERVICE ON RENDER</text><text x="72" y="745" fill="#75816b" font-size="13">FastAPI serves the interface, API, public files and Sphinx guide. No GPU or database required.</text>
<text x="885" y="716" fill="#3f5839" font-size="13">Keys stay on the server.</text><text x="885" y="741" fill="#75816b" font-size="13">Live mode calls an external model API.</text>
</g></svg>
