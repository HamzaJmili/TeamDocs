name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.ingest
      - run: git diff --exit-code -- data/index
      - run: python -m pytest -q
      - run: python -m scripts.evaluate --split dev --output evaluation/ci-results.json
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-and-evaluation
          path: |
            docs/_build/html
            evaluation/ci-results.json
